name: Collect Threads insights

on:
  schedule:
    # 07:50 KST daily (22:50 UTC previous day) — before the morning writer runs at 08:40 KST
    - cron: "50 22 * * *"
  workflow_dispatch:

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch insights
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python insights.py
      - name: Commit metrics
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A metrics/
          if git diff --cached --quiet; then
            echo "no metrics change"
          else
            git commit -m "metrics: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase origin main || true
            git push
          fi
