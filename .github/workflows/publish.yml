name: Publish to Threads

on:
  schedule:
    # Posts are scheduled at irregular times between ~09:30 and ~19:30 KST
    # (00:30–10:30 UTC). Runs every 10 min inside the window; publish.py is
    # idempotent and posts whatever is due but not yet posted.
    - cron: "*/10 0-10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, no posting)"
        type: boolean
        default: false
      check:
        description: "Only verify the token (calls /me, posts nothing)"
        type: boolean
        default: false
      test_post:
        description: "Publish this exact text as a one-off test post"
        type: string
        default: ""

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due posts
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CHECK: ${{ inputs.check && '1' || '' }}
          TEST_POST: ${{ inputs.test_post }}
        run: python publish.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A state/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase origin main || true
            git push
          fi
