name: Publish to Threads

on:
  schedule:
    # 10:00–18:00 KST = 01:00–09:00 UTC. Runs every 15 min inside the window;
    # publish.py is idempotent and posts whatever is due but not yet posted.
    - cron: "0,15,30,45 1-9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, no posting)"
        type: boolean
        default: false

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish due posts
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python publish.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase origin main || true
            git push
          fi
