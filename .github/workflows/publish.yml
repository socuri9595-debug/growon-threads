name: Publish to Threads

on:
  schedule:
    # Posts fall in morning (07:40–09:50), lunch (11:50–13:40) and evening
    # (18:10–22:20) KST, occasionally mid-afternoon. Window 07:30–22:30 KST =
    # 22:30–13:30 UTC. Runs every 10 min; publish.py is idempotent.
    - cron: "*/10 22-23 * * *"
    - cron: "*/10 0-13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, no posting)"
        type: boolean
        default: false
      check:
        description: "Only verify the token (calls /me, posts nothing)"
        type: boolean
        default: false
      test_post:
        description: "Publish this exact text as a one-off test post"
        type: string
        default: ""

concurrency:
  group: threads-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync latest state (avoid double publish)
        run: git pull --rebase origin main || true

      - name: Publish due posts (growon)
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CHECK: ${{ inputs.check && '1' || '' }}
          TEST_POST: ${{ inputs.test_post }}
        run: python publish.py

      - name: Publish due posts (salkka)
        if: always()
        env:
          ACCOUNT: salkka
          THREADS_TOKEN_SALKKA: ${{ secrets.THREADS_TOKEN_SALKKA }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python publish.py

      - name: Commit state
        if: always()
        run: |
          git config user.name "threads-bot"
          git config user.email "threads-bot@users.noreply.github.com"
          git add -A state/ accounts/*/state/
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "state: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
            git pull --rebase origin main || true
            git push
          fi
